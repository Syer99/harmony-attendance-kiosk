<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Attendance Kiosk</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        .logo { height: 60px; margin-bottom: 10px; }
        .status-bar { display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 14px; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        button { padding: 15px 30px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; transition: all 0.3s; }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover:not(:disabled) { background: #5568d3; transform: translateY(-2px); }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; opacity: 0.6; }
        .btn-secondary { background: #f39c12; color: white; }
        .btn-secondary:disabled { background: #ccc; cursor: not-allowed; opacity: 0.6; }
        .name-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .name-btn { padding: 20px; background: white; border: 2px solid #e0e0e0; border-radius: 8px; cursor: pointer; transition: all 0.3s; }
        .name-btn:hover { border-color: #667eea; box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2); }
        .name-btn.disabled { opacity: 0.5; cursor: not-allowed; background: #f5f5f5; }
        .status-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; margin-top: 5px; }
        .status-in { background: #d4edda; color: #155724; }
        .status-out { background: #fff3cd; color: #856404; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="harmony_logo.png" alt="Harmony Logo" class="logo">
            <h1>Staff Attendance</h1>
            <p id="current-time">Loading date...</p>
            <p id="connection-status">🟢 Online</p>
        </div>

        <div id="main-view">
            <div class="btn-group">
                <button class="btn-primary" id="clock-in-btn">CLOCK IN</button>
                <button class="btn-secondary" id="clock-out-btn">CLOCK OUT</button>
            </div>
            <p id="pending-sync">0 pending sync</p>
        </div>

        <div id="name-selection-view" style="display: none;">
            <h2>Select Staff Name</h2>
            <p id="loading-status">Loading staff status...</p>
            <div class="name-grid" id="name-grid"></div>
            <button class="btn-primary">← Back</button>
        </div>

        <div id="photo-view" style="display: none;">
            <h2 id="selected-staff-name">Staff Name</h2>
            <p>Please look at the camera</p>
            <video id="camera" width="100%" height="auto" autoplay></video>
            <div class="btn-group">
                <button class="btn-primary">SNAP & SUBMIT</button>
                <button class="btn-primary">← Back</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        // ========== CONFIGURATION ==========
        const SCRIPT_URL = "https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec";
        const STAFF_NAMES = ["HAJAR", "AHMAD", "SITI", "KARIM", "FATIMAH", "HASSAN"];

        // ========== STATE VARIABLES ==========
        let staffStatus = {}; // { "HAJAR": "IN", "AHMAD": "OUT", ... }
        let currentStaff = null;
        let currentAction = null;
        let pendingQueue = [];

        // ========== INITIALIZATION ==========
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🚀 Page loaded - initializing status...');
            
            // Load from localStorage first (instant UI update)
            const cachedStatus = localStorage.getItem('staffStatus');
            if (cachedStatus) {
                try {
                    staffStatus = JSON.parse(cachedStatus);
                    console.log('📦 Loaded status from cache:', staffStatus);
                } catch (e) {
                    console.error('Failed to parse cached status:', e);
                }
            }
            
            // Then fetch fresh status from server
            try {
                await fetchStaffStatus();
                console.log('✅ Status fetched from server:', staffStatus);
            } catch (error) {
                console.error('⚠️ Failed to fetch status on load:', error);
                // UI still works with cached status
            }
            
            // Initialize other features
            updateClock();
            setInterval(updateClock, 1000);
            loadPendingQueue();
            window.addEventListener('online', syncPendingData);
            window.addEventListener('offline', updateConnectionStatus);
        });

        // ========== FETCH STATUS FROM SERVER ==========
        async function fetchStaffStatus() {
            try {
                const response = await fetch(SCRIPT_URL + '?action=get_status');
                const data = await response.json();
                
                if (data.success && data.status) {
                    staffStatus = data.status;
                    
                    // 💾 Save to localStorage for persistence
                    localStorage.setItem('staffStatus', JSON.stringify(staffStatus));
                    console.log('💾 Status saved to localStorage');
                } else {
                    console.warn('Unexpected response:', data);
                }
            } catch (error) {
                console.error('❌ Error fetching status:', error);
                throw error;
            }
        }

        // ========== CLOCK IN / OUT BUTTONS ==========
        document.getElementById('clock-in-btn').addEventListener('click', () => selectType('IN'));
        document.getElementById('clock-out-btn').addEventListener('click', () => selectType('OUT'));

        async function selectType(type) {
            currentAction = type;
            
            // Fetch fresh status before showing names
            try {
                await fetchStaffStatus();
            } catch (error) {
                console.error('Failed to refresh status:', error);
            }
            
            renderNameGrid();
            document.getElementById('main-view').style.display = 'none';
            document.getElementById('name-selection-view').style.display = 'block';
        }

        // ========== RENDER NAME GRID ==========
        function renderNameGrid() {
            const grid = document.getElementById('name-grid');
            grid.innerHTML = '';
            
            STAFF_NAMES.forEach(name => {
                const status = staffStatus[name] || 'OUT';
                const isDisabled = (currentAction === 'IN' && status === 'IN') || 
                                   (currentAction === 'OUT' && status === 'OUT');
                
                const btn = document.createElement('button');
                btn.className = `name-btn ${isDisabled ? 'disabled' : ''}`;
                btn.disabled = isDisabled;
                
                let statusLabel = status === 'IN' ? '🟢 CLOCKED IN' : '⚪ CLOCKED OUT';
                btn.innerHTML = `${name}
${statusLabel}`;
                
                if (!isDisabled) {
                    btn.addEventListener('click', () => selectStaff(name));
                } else {
                    const action = currentAction === 'IN' ? 'clock in' : 'clock out';
                    btn.title = `Cannot ${action}: Staff is already ${statusLabel.toLowerCase()}`;
                }
                
                grid.appendChild(btn);
            });
        }

        // ========== SELECT STAFF ==========
        function selectStaff(name) {
            currentStaff = name;
            document.getElementById('selected-staff-name').textContent = name;
            document.getElementById('name-selection-view').style.display = 'none';
            document.getElementById('photo-view').style.display = 'block';
            
            startCamera();
        }

        // ========== CAMERA ==========
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                document.getElementById('camera').srcObject = stream;
            } catch (error) {
                console.error('Camera error:', error);
                Swal.fire('Error', 'Cannot access camera', 'error');
            }
        }

        // ========== CAPTURE & SUBMIT ==========
        async function capturePhoto() {
            const canvas = document.createElement('canvas');
            const video = document.getElementById('camera');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);
            
            canvas.toBlob(blob => submitData(blob), 'image/jpeg', 0.8);
        }

        // ========== SUBMIT DATA ==========
        async function submitData(photoBlob) {
            const formData = new FormData();
            formData.append('staffName', currentStaff);
            formData.append('type', currentAction);
            formData.append('timestamp', new Date().toISOString());
            formData.append('photo', photoBlob, `${currentStaff}_${currentAction}.jpg`);
            
            try {
                const sendSuccess = await sendToServer(formData);
                
                if (sendSuccess) {
                    // ✅ Update cache optimistically
                    staffStatus[currentStaff] = currentAction;
                    localStorage.setItem('staffStatus', JSON.stringify(staffStatus));
                    console.log('✅ Cache updated:', staffStatus);
                    
                    Swal.fire('Success', `${currentStaff} clocked ${currentAction} successfully!`, 'success');
                    resetUI();
                } else {
                    throw new Error('Server returned error');
                }
            } catch (error) {
                console.error('Submit error:', error);
                // Save to offline queue
                pendingQueue.push({ staffName: currentStaff, type: currentAction, photoBlob, timestamp: new Date().toISOString() });
                savePendingQueue();
                updatePendingCount();
                
                Swal.fire('Offline', 'Data saved. Will sync when online.', 'info');
                resetUI();
            }
        }

        // ========== SEND TO SERVER ==========
        async function sendToServer(formData) {
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: formData,
                    mode: 'no-cors'
                });
                return true; // no-cors doesn't throw on server error
            } catch (error) {
                console.error('Network error:', error);
                return false;
            }
        }

        // ========== OFFLINE QUEUE ==========
        function savePendingQueue() {
            localStorage.setItem('pendingQueue', JSON.stringify(pendingQueue.map(item => ({
                ...item,
                photoBlob: item.photoBlob.toString() // Placeholder
            }))));
        }

        function loadPendingQueue() {
            const saved = localStorage.getItem('pendingQueue');
            if (saved) {
                try {
                    pendingQueue = JSON.parse(saved);
                    updatePendingCount();
                } catch (e) {
                    console.error('Failed to load pending queue:', e);
                }
            }
        }

        function updatePendingCount() {
            document.getElementById('pending-sync').textContent = `${pendingQueue.length} pending sync`;
        }

        async function syncPendingData() {
            console.log('🔄 Syncing pending data...');
            // Implementation for syncing offline queue
        }

        // ========== UI HELPERS ==========
        function goBack() {
            document.getElementById('photo-view').style.display = 'none';
            document.getElementById('name-selection-view').style.display = 'none';
            document.getElementById('main-view').style.display = 'block';
            stopCamera();
        }

        function resetUI() {
            stopCamera();
            document.getElementById('photo-view').style.display = 'none';
            document.getElementById('name-selection-view').style.display = 'none';
            document.getElementById('main-view').style.display = 'block';
            currentStaff = null;
            currentAction = null;
        }

        function stopCamera() {
            const video = document.getElementById('camera');
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('current-time').textContent = now.toLocaleString();
        }

        function updateConnectionStatus() {
            const status = navigator.onLine ? '🟢 Online' : '🔴 Offline';
            document.getElementById('connection-status').textContent = status;
        }
    </script>
</body>
</html>
